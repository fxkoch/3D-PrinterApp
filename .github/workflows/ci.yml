name: CI

on:
  push:
    branches-ignore: [slice-jobs]
  pull_request:

jobs:
  core-tests:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test MakerSliceCore
        working-directory: Packages/MakerSliceCore
        run: swift test

  ios-build:
    name: iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build for simulator
        run: |
          set +e
          xcodebuild build \
            -project MakerSlice.xcodeproj \
            -scheme MakerSlice \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          echo "=== errors ==="
          grep -E "error:|fatal error" build.log | sort -u | head -150
          echo "=== tail ==="
          tail -15 build.log
          exit $status
      - name: UI tests on simulator
        run: |
          set +e
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/^ *(iPhone[^(]*) \(.*/\1/' | xargs)
          echo "Using simulator: $DEVICE"
          xcodebuild test \
            -project MakerSlice.xcodeproj \
            -scheme MakerSlice \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -resultBundlePath UITests.xcresult \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          grep -E "error:|Test Case .*(passed|failed)|XCTAssert|Executed" test.log | head -80
          tail -20 test.log
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path UITests.xcresult --output-path screenshots || true
          ls screenshots | head -50
          exit $status
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Test core on macOS
        working-directory: Packages/MakerSliceCore
        run: swift test
